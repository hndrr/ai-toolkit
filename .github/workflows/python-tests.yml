name: Python tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve locked dependencies on Python ${{ matrix.python-version }}
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Run Beam integration unit tests
        run: uv run --no-sync python -m unittest testing.test_run_beam
